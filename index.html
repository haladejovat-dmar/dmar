<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D’MAR — brzy spustíme</title>
<meta name="description" content="D’MAR – ručně háčkované kabelky, každá jiná. Brzy spustíme.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EE;--paper:#EAE3D8;--ink:#252321;--muted:#6C6259;--line:#D6CABC;--accent:#B7A493}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.6 Manrope,Arial,sans-serif}
a{color:inherit}
.wrap{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(32px,6vw,110px);padding:clamp(28px,6vw,90px) clamp(20px,7vw,130px);max-width:1400px;margin:0 auto}
.photo{justify-self:end;width:min(100%,420px);aspect-ratio:2/3;background:var(--paper);overflow:hidden;box-shadow:0 18px 40px rgba(60,48,41,.08)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.text{max-width:470px}
.mono{display:block;height:64px;width:auto;margin:0 0 34px}
.kicker{font:500 11px/1.3 Manrope,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font:400 clamp(52px,7vw,96px)/1 'Bodoni Moda',Georgia,serif;letter-spacing:-.04em;margin:0 0 18px}
.lead{font:400 clamp(22px,2.3vw,30px)/1.35 'Bodoni Moda',Georgia,serif;letter-spacing:-.01em;margin:0 0 14px}
.tag{font:500 11px/1.5 Manrope,sans-serif;letter-spacing:.18em;color:var(--muted);margin:0 0 44px}
.contact{border-top:1px solid var(--line);padding-top:24px;display:flex;flex-wrap:wrap;gap:12px 32px;font-size:12px;letter-spacing:.06em}
.contact a{text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
.contact a:hover,.contact a:focus-visible{border-bottom-color:currentColor}
a:focus-visible{outline:2px solid #745b43;outline-offset:3px}
@media(max-width:760px){
 .wrap{grid-template-columns:1fr;gap:34px;padding:34px 22px 44px;align-content:start}
 .photo{justify-self:center;width:min(78vw,340px)}
 .text{text-align:center;margin:0 auto}
 .mono{height:52px;margin:0 auto 24px}
 .contact{justify-content:center}
 .tag{margin-bottom:32px}
}
.countdown{display:flex;gap:clamp(14px,2.2vw,30px);margin:6px 0 30px}
.cd-unit{display:flex;flex-direction:column;align-items:center;min-width:58px}
.cd-num{font:400 clamp(34px,4vw,52px)/1 'Bodoni Moda',Georgia,serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd-lab{font:500 9px/1.2 Manrope,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.cd-date{font:500 11px/1.4 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
@media(max-width:760px){.countdown{justify-content:center}.cd-unit{min-width:52px}}
</style>
</head>
